name: Validate Pinpoint

on:
  push:
    paths:
      - "skills/**"
      - "commands/**"
      - "bin/**"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - "README.zh-CN.md"
      - "INSTALL.md"
      - "docs/**"
      - "evals/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "skills/**"
      - "commands/**"
      - "bin/**"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - "README.zh-CN.md"
      - "INSTALL.md"
      - "docs/**"
      - "evals/**"
      - "tests/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Validate all Skills against the Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            uvx \
              --from "git+https://github.com/agentskills/agentskills.git@27a9f0c075e876ad632fc2e88b8866c5dc8ca15c#subdirectory=skills-ref" \
              skills-ref validate "$skill"
          done

      - name: Validate packaged commands and installer metadata
        run: node bin/pinpoint-install.mjs --check

      - name: Check five-Skill inventory consistency
        shell: bash
        run: |
          set -euo pipefail
          section() {
            awk -v a="$2" '$0 ~ "^" a { on = 1; next } /^## / { on = 0 } on' "$1"
          }
          has_name() { grep -Eq "(^|[^[:alnum:]-])$1([^[:alnum:]-]|$)"; }
          fail=0
          check_section() {
            file="$1"; anchor="$2"
            content="$(section "$file" "$anchor")"
            for name in pinpoint pinpoint-review pinpoint-commit pinpoint-pr pinpoint-help; do
              if ! has_name "$name" <<< "$content"; then
                echo "::error file=${file}::${name} missing from section '${anchor}'"
                fail=1
              fi
            done
          }
          check_section INSTALL.md "## Explicit invocation"
          check_section INSTALL.md "## Install one Skill"
          check_section INSTALL.md "## Verify"
          check_section README.md "## Skills"
          check_section README.md "## Commands"
          check_section README.zh-CN.md "## Skills"
          check_section README.zh-CN.md "## 命令"
          check_section skills/pinpoint-help/SKILL.md "## Choose the Skill"
          check_section skills/pinpoint-help/SKILL.md "## Explain Invocation"
          exit "$fail"

      - name: Validate the packaged entrypoint
        run: npm exec --yes --package=. -- pinpoint-install --version

      - name: Validate evaluation assets
        run: node scripts/eval-validate.mjs

      - name: Test evaluation tooling
        run: node tests/eval-tools.mjs

  installer-smoke:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Smoke-test project install, update, conflict handling, and uninstall
        run: node tests/installer-smoke.mjs
