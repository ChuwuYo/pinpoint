name: Validate Pinpoint

on:
  push:
    paths:
      - "skills/**"
      - "commands/**"
      - "bin/**"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - "README.zh-CN.md"
      - "INSTALL.md"
      - "docs/**"
      - "evals/**"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "skills/**"
      - "commands/**"
      - "bin/**"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - "README.zh-CN.md"
      - "INSTALL.md"
      - "docs/**"
      - "evals/**"
      - "tests/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Validate all Skills against the Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            uvx \
              --from "git+https://github.com/agentskills/agentskills.git@27a9f0c075e876ad632fc2e88b8866c5dc8ca15c#subdirectory=skills-ref" \
              skills-ref validate "$skill"
          done

      - name: Run package, doc, and evaluation checks
        run: npm test

  installer-smoke:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
          - os: windows-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Smoke-test project install, update, conflict handling, and uninstall
        run: node tests/installer-smoke.mjs

      - name: Smoke-test the published package shape (npm pack + install from tarball)
        run: node tests/package-smoke.mjs
