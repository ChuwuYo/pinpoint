name: Validate Skill

on:
  push:
    paths:
      - "skills/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Validate all Skills against the Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            uvx \
              --from "git+https://github.com/agentskills/agentskills.git@27a9f0c075e876ad632fc2e88b8866c5dc8ca15c#subdirectory=skills-ref" \
              skills-ref validate "$skill"
          done
